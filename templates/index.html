<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lvnah/swiftkit@main/core.css">
</head>
<body>
  <nav class="navbar">
    <strong id="nav-title">Application</strong>
    <div id="nav-links"></div>
  </nav>

  <main class="container">
    <div class="row between">
      <h2>Liste des éléments</h2>
      <button class="btn primary" onclick="openForm()">+ Nouvel élément</button>
    </div>

    <div class="card mt-2 table-wrap">
      <table>
        <thead>
          <tr><th>ID</th><th>Titre</th><th>Description</th><th>Statut</th><th>Actions</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>

  <div id="item-modal" class="modal-backdrop">
    <div class="card modal">
      <h3 id="modal-title">Nouvel élément</h3>
      <form id="item-form">
        <input type="hidden" id="item-id">
        <div class="mt-2"><label>Titre</label><input id="f-titre" required></div>
        <div class="mt-2"><label>Description</label><input id="f-description"></div>
        <div class="mt-2">
          <label>Statut</label>
          <select id="f-statut">
            <option value="En cours">En cours</option>
            <option value="Terminé">Terminé</option>
          </select>
        </div>
        <div class="row between mt-3">
          <button type="button" class="btn" onclick="$ui.closeModal('item-modal')">Annuler</button>
          <button type="submit" class="btn primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/gh/lvnah/swiftkit@main/core.js"></script>
  <script>
    let itemsCache = [];

    async function init() {
      const cfg = await $db.schema();
      $ui.qs('#nav-title').textContent = cfg.appName;
      const links = ['<a href="index.html">Accueil</a>'];
      if (cfg.admin) links.push('<a href="admin.html">Admin</a>');
      if (cfg.auth) links.push('<a href="#" onclick="$auth.logout()">Déconnexion</a>');
      $ui.qs('#nav-links').innerHTML = links.join('');
      loadItems();
    }

    async function loadItems() {
      itemsCache = await $db.list('items');
      $ui.qs('#rows').innerHTML = itemsCache.map(item => `
        <tr>
          <td>#${item.id}</td>
          <td><strong>${$ui.esc(item.titre)}</strong></td>
          <td>${$ui.esc(item.description)}</td>
          <td>${$ui.esc(item.statut)}</td>
          <td class="row">
            <button class="btn sm" onclick="openForm(${item.id})">Éditer</button>
            <button class="btn sm danger" onclick="removeItem(${item.id})">Supprimer</button>
          </td>
        </tr>
      `).join('');
    }

    function openForm(id = null) {
      const item = itemsCache.find(i => i.id == id);
      $ui.qs('#modal-title').textContent = item ? `Modifier #${id}` : 'Nouvel élément';
      $ui.qs('#item-id').value = item ? item.id : '';
      $ui.qs('#f-titre').value = item ? item.titre : '';
      $ui.qs('#f-description').value = item ? item.description : '';
      $ui.qs('#f-statut').value = item ? item.statut : 'En cours';
      $ui.openModal('item-modal');
    }

    $ui.qs('#item-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = $ui.qs('#item-id').value;
      const payload = {
        titre: $ui.qs('#f-titre').value,
        description: $ui.qs('#f-description').value,
        statut: $ui.qs('#f-statut').value
      };
      if (id) await $db.update('items', id, payload);
      else await $db.create('items', payload);
      $ui.closeModal('item-modal');
      $ui.toast(id ? 'Modifié' : 'Ajouté');
      loadItems();
    });

    async function removeItem(id) {
      if (!confirm('Supprimer cet élément ?')) return;
      await $db.delete('items', id);
      $ui.toast('Supprimé');
      loadItems();
    }

    init();
  </script>
</body>
</html>
