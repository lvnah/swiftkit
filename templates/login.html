<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lvnah/swiftkit@main/core.css">
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh;">
  <div class="card" style="width:100%; max-width:360px;">
    <h2 style="margin-bottom:16px;">Connexion</h2>
    <form id="login-form">
      <div class="mt-2"><label>Identifiant</label><input type="text" id="username" value="admin" required></div>
      <div class="mt-2"><label>Mot de passe</label><input type="password" id="password" value="admin" required></div>
      <button type="submit" class="btn primary mt-3" style="width:100%;">Se connecter</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/gh/lvnah/swiftkit@main/core.js"></script>
  <script>
    $ui.qs('#login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await $auth.login($ui.qs('#username').value, $ui.qs('#password').value);
        location.href = 'index.html';
      } catch (err) {
        $ui.toast(err.message);
      }
    });
  </script>
</body>
</html>
