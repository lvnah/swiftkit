<div class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-zinc-900/80 border border-zinc-800 rounded-2xl p-8 w-full max-w-sm shadow-2xl">
    <h2 class="text-xl font-bold mb-6">Connexion</h2>
    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-xs text-gray-400 mb-1">Identifiant</label>
        <input type="text" id="username" value="admin" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2.5 text-sm focus:border-violet-500 focus:outline-none">
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1">Mot de passe</label>
        <input type="password" id="password" value="admin" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2.5 text-sm focus:border-violet-500 focus:outline-none">
      </div>
      <button type="submit" class="w-full bg-violet-600 hover:bg-violet-500 text-white font-medium py-2.5 rounded-lg text-sm transition">
        Se connecter
      </button>
    </form>
  </div>
</div>

<script>
  $ui.qs('#login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      await $auth.login($ui.qs('#username').value, $ui.qs('#password').value);
    } catch (err) {
      $ui.toast(err.message);
    }
  });
</script>
