<nav class="border-b border-zinc-800 bg-zinc-950/80 px-6 py-4 flex justify-between items-center">
  <strong id="nav-title" class="text-lg font-bold tracking-tight">Application</strong>
  <div id="nav-links" class="flex items-center gap-4 text-sm text-gray-300"></div>
</nav>

<main class="max-w-5xl mx-auto p-6">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-xl font-semibold">Mes éléments</h2>
    <button onclick="openForm()" class="bg-violet-600 hover:bg-violet-500 text-white text-sm font-medium px-4 py-2 rounded-lg transition">
      + Nouvel élément
    </button>
  </div>

  <div class="bg-zinc-900/70 border border-zinc-800 rounded-xl overflow-x-auto">
    <table class="w-full text-left text-sm">
      <thead class="border-b border-zinc-800 text-xs uppercase text-gray-400 bg-zinc-950/40">
        <tr><th class="p-3.5">ID</th><th class="p-3.5">Titre</th><th class="p-3.5">Description</th><th class="p-3.5">Statut</th><th class="p-3.5">Actions</th></tr>
      </thead>
      <tbody id="rows" class="divide-y divide-zinc-800/70"></tbody>
    </table>
  </div>
</main>

<div id="item-modal" class="hidden fixed inset-0 bg-black/75 flex items-center justify-center p-4 z-50">
  <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 w-full max-w-md">
    <h3 id="modal-title" class="text-lg font-bold mb-4">Nouvel élément</h3>
    <form id="item-form" class="space-y-3">
      <input type="hidden" id="item-id">
      <div><label class="block text-xs text-gray-400 mb-1">Titre</label><input id="f-titre" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-sm"></div>
      <div><label class="block text-xs text-gray-400 mb-1">Description</label><input id="f-description" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-sm"></div>
      <div>
        <label class="block text-xs text-gray-400 mb-1">Statut</label>
        <select id="f-statut" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-sm">
          <option value="En cours">En cours</option>
          <option value="Terminé">Terminé</option>
        </select>
      </div>
      <div class="flex justify-end gap-2 pt-3">
        <button type="button" onclick="$ui.closeModal('item-modal')" class="px-4 py-2 rounded-lg border border-zinc-700 text-sm">Annuler</button>
        <button type="submit" class="px-4 py-2 rounded-lg bg-violet-600 hover:bg-violet-500 text-white text-sm font-medium">Enregistrer</button>
      </div>
    </form>
  </div>
</div>

<script>
  var itemsCache = [];

  async function initIndex() {
    const cfg = await $db.schema();
    $ui.qs('#nav-title').textContent = cfg.appName;
    const btns = [`<button onclick="$router.go('index')" class="hover:text-white">Accueil</button>`];
    if (cfg.admin) btns.push(`<button onclick="$router.go('admin')" class="hover:text-white">Admin</button>`);
    if (cfg.user?.role === 'admin') btns.push(`<a href="/visualdata" target="_blank" class="text-violet-400 hover:text-violet-300">VisualData</a>`);
    if (cfg.auth) btns.push(`<button onclick="$auth.logout()" class="text-red-400 hover:text-red-300">Déconnexion</button>`);
    $ui.qs('#nav-links').innerHTML = btns.join('');
    loadItems();
  }

  async function loadItems() {
    itemsCache = await $db.list('items');
    $ui.qs('#rows').innerHTML = itemsCache.map(item => `
      <tr class="hover:bg-zinc-800/40">
        <td class="p-3.5 text-gray-400">#${item.id}</td>
        <td class="p-3.5 font-medium">${$ui.esc(item.titre)}</td>
        <td class="p-3.5 text-gray-400">${$ui.esc(item.description)}</td>
        <td class="p-3.5"><span class="px-2.5 py-0.5 rounded-full text-xs bg-violet-500/15 text-violet-300 border border-violet-500/30">${$ui.esc(item.statut)}</span></td>
        <td class="p-3.5 flex gap-2">
          <button onclick="openForm(${item.id})" class="px-2.5 py-1 rounded bg-zinc-800 hover:bg-zinc-700 text-xs">Éditer</button>
          <button onclick="removeItem(${item.id})" class="px-2.5 py-1 rounded border border-red-500/40 text-red-400 hover:bg-red-500 hover:text-white text-xs">Suppr</button>
        </td>
      </tr>
    `).join('');
  }

  function openForm(id = null) {
    const item = itemsCache.find(i => i.id == id);
    $ui.qs('#modal-title').textContent = item ? `Modifier #${id}` : 'Nouvel élément';
    $ui.qs('#item-id').value = item ? item.id : '';
    $ui.qs('#f-titre').value = item ? item.titre : '';
    $ui.qs('#f-description').value = item ? item.description : '';
    $ui.qs('#f-statut').value = item ? item.statut : 'En cours';
    $ui.openModal('item-modal');
  }

  $ui.qs('#item-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = $ui.qs('#item-id').value;
    const payload = {
      titre: $ui.qs('#f-titre').value,
      description: $ui.qs('#f-description').value,
      statut: $ui.qs('#f-statut').value
    };
    if (id) await $db.update('items', id, payload);
    else await $db.create('items', payload);
    $ui.closeModal('item-modal');
    $ui.toast(id ? 'Modifié' : 'Ajouté');
    loadItems();
  });

  async function removeItem(id) {
    if (!confirm('Supprimer cet élément ?')) return;
    await $db.delete('items', id);
    $ui.toast('Supprimé');
    loadItems();
  }

  initIndex();
</script>
