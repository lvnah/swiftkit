<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SwiftKit App</title>
  <!-- Tailwind CSS chargé directement (0 dépendance, 100% immédiat) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SDK SwiftKit (utiliser raw.githubusercontent ou un tag @vX.X pour éviter tout cache) -->
  <script src="https://raw.githubusercontent.com/lvnah/swiftkit/main/core.js"></script>
</head>
<body class="bg-[#0e0f11] text-gray-100 min-h-screen">
  <div id="app"></div>

  <script>
    // Au démarrage, on charge la vue principale (qui bascule auto sur 'login' si non connecté)
    window.addEventListener('DOMContentLoaded', () => $router.go('index'));
  </script>
</body>
</html>
